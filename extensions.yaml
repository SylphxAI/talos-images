# System extensions to include in the custom Talos image.
#
# The Kata Containers extension is NOT pinned here by version: system
# extensions are tied to a Talos line, so the build resolves the extension OCI
# reference (with digest) from the Sidero factory catalog for the requested
# Talos version. An explicit override can be passed per run with
# `workflow_dispatch -> kata_extension_image`.
#
# Selection rules (see build.yml "Resolve extensions"):
#   1. kata_extension_image input, if set  -> use verbatim
#   2. otherwise -> look up `siderolabs/kata-containers` in
#      https://factory.talos.dev/version/<talos_version>/extensions/official
#
# Why: pinning a single Kata tag made every Nova Talos line require editing this
# file, and made the OCI *digest* the only trustworthy input (two builds of the
# same tag shipped different layers). Resolving per version removes that trap.
extensions: []
