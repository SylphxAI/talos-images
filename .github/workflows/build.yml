name: Build Talos Image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Talos version (e.g. v1.14.1)"
        default: "v1.14.1"
        required: true
      kata_extension_image:
        description: "Optional explicit Kata extension image (repo:tag@sha256:...). Empty = resolve from the Sidero factory catalog for talos_version."
        default: ""
        required: false
      native_runtime_release:
        description: "Optional native stack manifest: Talos/source identity plus immutable imager, Kata and matching kubelet references. A completed rollout manifest may be reused."
        default: ""
        required: false
      native_host_memory:
        description: "Build the reviewed native host-memory runtime and a separate immutable one-node artifact variant; does not activate it on any node."
        type: boolean
        default: false
        required: false
      stargz:
        description: "Include the release-compatible stargz snapshotter in a separate -stargz artifact variant"
        type: boolean
        default: false
        required: false
      uki_nested_kvm:
        description: "Build the pinned stock v1.14.1 + Kata 3.32.0 nested-KVM UKI (main only, separate release)"
        type: boolean
        default: false
        required: false

env:
  TALOS_VERSION: ${{ inputs.talos_version || 'v1.14.1' }}
  KATA_EXTENSION_IMAGE: ${{ inputs.kata_extension_image || '' }}
  STARGZ_ENABLED: ${{ inputs.stargz && 'true' || 'false' }}
  NATIVE_RUNTIME_RELEASE: ${{ inputs.native_runtime_release || '' }}
  NATIVE_HOST_MEMORY: ${{ inputs.native_host_memory && 'true' || 'false' }}
  UKI_NESTED_KVM: ${{ inputs.uki_nested_kvm && 'true' || 'false' }}

jobs:
  build:
    if: github.event.repository.visibility == 'public' && (!inputs.uki_nested_kvm || github.ref == 'refs/heads/main')
    # GitHub's free standard hosted runner (a public repository, owner#750):
    # the imager needs a privileged Docker with loop devices, which our Kata
    # runners do not give (modprobe loop fails, 2026-09-27).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo mv crane /usr/local/bin/

      # The native stack exports a multi-layer OCI archive with `type=oci`,
      # which the default docker driver cannot write. The docker-container
      # builder is the supported driver for that exporter.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish native runtime stack
        if: github.event_name == 'push' || (inputs.native_host_memory && !inputs.uki_nested_kvm)
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source host-memory/profile.sh
          if [ -n "$NATIVE_RUNTIME_RELEASE" ] || [ -n "$KATA_EXTENSION_IMAGE" ]; then
            echo 'local native build cannot be mixed with component overrides' >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y skopeo
          # All OS-stack components share the existing public artifact repository;
          # no new package visibility, credential or repository grant is required.
          kata="ghcr.io/sylphxai/talos-installer:runtime-kata-$TALOS_VERSION-$SOURCE_SHA"
          imager="ghcr.io/sylphxai/talos-installer:runtime-imager-$TALOS_VERSION-$SOURCE_SHA"
          kubelet="ghcr.io/sylphxai/talos-installer:v1.36.4-kubelet.$TALOS_VERSION.$SOURCE_SHA"
          OCI_DIR="$RUNNER_TEMP/native-kata" bash host-memory/build-oci.sh kata
          skopeo copy --authfile "$HOME/.docker/config.json" --all --preserve-digests "oci:$RUNNER_TEMP/native-kata" "docker://$kata"
          OCI_DIR="$RUNNER_TEMP/native-imager" bash host-memory/build-oci.sh imager
          skopeo copy --authfile "$HOME/.docker/config.json" --all --preserve-digests "oci:$RUNNER_TEMP/native-imager" "docker://$imager"
          OCI_DIR="$RUNNER_TEMP/native-kubelet" bash host-memory/build-oci.sh kubelet
          skopeo copy --authfile "$HOME/.docker/config.json" --all --preserve-digests "oci:$RUNNER_TEMP/native-kubelet" "docker://$kubelet"
          kata_digest=$(crane digest "$kata")
          kata_ref="${kata%:*}@$kata_digest"
          kernel="$RUNNER_TEMP/vmlinux.container"
          crane export --platform linux/amd64 "$kata_ref" - | \
            tar -xOf - rootfs/usr/local/share/kata-containers/vmlinux.container > "$kernel"
          bash guest-kernel/build-kernel.sh symbols "$kernel"
          kernel_sha=$(sha256sum "$kernel" | cut -d' ' -f1)
          printf 'Kata extension: %s\n\nGuest kernel SHA-256: %s\n' "$kata_ref" "$kernel_sha" >> "$GITHUB_STEP_SUMMARY"
          imager_digest=$(crane digest "$imager")
          kubelet_digest=$(crane digest "$kubelet")
          release=$(jq -cn --arg version "$TALOS_VERSION" --arg source "$SOURCE_SHA" --arg imager "${imager%:*}@$imager_digest" --arg kata "$kata_ref" --arg kubelet "$kubelet@$kubelet_digest" '{schema_version:2,talos_version:$version,source_revision:$source,imager:$imager,kata_extension:$kata,kubelet:$kubelet,kubelet_version:"v1.36.4"}')
          printf 'NATIVE_RUNTIME_RELEASE=%s\n' "$release" >> "$GITHUB_ENV"
          printf '%s\n' "$release"

      - name: Build and verify stock nested Kata extension
        if: inputs.uki_nested_kvm
        id: stock-kata
        run: bash scripts/build-stock-nested-kata.sh

      - name: Resolve extensions
        id: ext
        env:
          STOCK_NESTED_KATA_REF: ${{ steps.stock-kata.outputs.kata_ref }}
        run: bash scripts/resolve-extensions.sh

      # Metal image needs loopback device support — use --privileged
      # and ensure /dev is properly mounted
      - name: Build metal image
        env:
          IMAGER: ${{ steps.ext.outputs.imager_ref }}
          FLAGS: ${{ steps.ext.outputs.flags }}
        run: |
          read -ra args <<< "$FLAGS"
          sudo modprobe loop
          mkdir -p /tmp/talos-out
          docker run --rm -t \
            -v /tmp/talos-out:/out \
            -v /dev:/dev \
            --privileged \
            "$IMAGER" metal "${args[@]}"
          ls -lh /tmp/talos-out/

      - name: Build installer image
        env:
          IMAGER: ${{ steps.ext.outputs.imager_ref }}
          FLAGS: ${{ steps.ext.outputs.flags }}
        run: |
          read -ra args <<< "$FLAGS"
          mkdir -p /tmp/talos-installer
          docker run --rm -t \
            -v /tmp/talos-installer:/out \
            --privileged \
            "$IMAGER" installer "${args[@]}"
          ls -lh /tmp/talos-installer/

      - name: Verify metal and installer UKIs before publication
        if: inputs.uki_nested_kvm
        env:
          GUEST_ELF_SHA256: ${{ steps.stock-kata.outputs.guest_elf_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtools python3-yaml squashfs-tools
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          zstd -d /tmp/talos-out/metal-amd64.raw.zst -o "$scratch/metal.raw"
          esp=$(partx --raw --noheadings -o START,TYPE "$scratch/metal.raw" | awk '$2 == "c12a7328-f81f-11d2-ba4b-00a0c93ec93b" {print $1}')
          [[ "$esp" =~ ^[0-9]+$ ]]
          mcopy -i "$scratch/metal.raw@@$((esp * 512))" "::/EFI/Linux/Talos-$TALOS_VERSION.efi" "$scratch/metal.efi"
          crane export - - < /tmp/talos-installer/installer-amd64.tar | tar -xOf - usr/install/amd64/vmlinuz.efi > "$scratch/installer.efi"
          {
            cat "$RUNNER_TEMP/stock-nested-guest-elf.txt"
            /usr/bin/python3 scripts/verify-stock-nested-uki.py "$scratch/metal.efi" "$scratch/installer.efi" "$GUEST_ELF_SHA256"
          } | tee /tmp/talos-out/stock-nested-verification.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push installer to GHCR
        id: installer
        env:
          ARTIFACT_TAG: ${{ steps.ext.outputs.artifact_tag }}
        run: |
          set -euo pipefail
          target="ghcr.io/sylphxai/talos-installer:$ARTIFACT_TAG"
          crane push --image-refs "$RUNNER_TEMP/installer-ref" /tmp/talos-installer/installer-amd64.tar "$target"
          digest=$(crane digest "$target")
          test "$(cat "$RUNNER_TEMP/installer-ref")" = "${target%:*}@$digest"
          printf 'Installer: %s@%s\n' "${target%:*}" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'ref=%s@%s\n' "${target%:*}" "$digest" >> "$GITHUB_OUTPUT"
          if [ -n "$NATIVE_RUNTIME_RELEASE" ]; then
            python3 scripts/runtime-release.py --installer "${target%:*}@$digest" > /tmp/talos-out/native-runtime-release.json
            printf 'release_asset=%s\n' /tmp/talos-out/native-runtime-release.json >> "$GITHUB_OUTPUT"
          fi

      - name: Write stock nested release receipt
        if: inputs.uki_nested_kvm
        id: stock-receipt
        env:
          ARTIFACT_TAG: ${{ steps.ext.outputs.artifact_tag }}
          IMAGER: ${{ steps.ext.outputs.imager_ref }}
          KATA: ${{ steps.stock-kata.outputs.kata_ref }}
          INSTALLER: ${{ steps.installer.outputs.ref }}
          GUEST_ELF_SHA256: ${{ steps.stock-kata.outputs.guest_elf_sha256 }}
        run: |
          set -euo pipefail
          source scripts/stock-nested-profile.sh
          cd /tmp/talos-out
          jq -n --arg tag "$ARTIFACT_TAG" --arg version "$TALOS_VERSION" --arg source "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg imager "$IMAGER" --arg base "$STOCK_NESTED_INSTALLER_BASE" --arg installer "$INSTALLER" \
            --arg kata "$KATA" --arg kata_base "$STOCK_NESTED_KATA_BASE" --arg elf "$GUEST_ELF_SHA256" \
            --arg metal "$(sha256sum metal-amd64.raw.zst | cut -d' ' -f1)" \
            '{schema_version:1,artifact_tag:$tag,talos_version:$version,source_revision:$source,build_run:$run,
              imager:$imager,installer_base:$base,installer:$installer,kata_base:$kata_base,kata_extension:$kata,
              guest_elf_sha256:$elf,metal_sha256:$metal,kernel_arg:"kvm_amd.nested=1"}' > stock-nested-release.json
          cat stock-nested-release.json
          printf 'receipt=%s\nproof=%s\n' "$PWD/stock-nested-release.json" "$PWD/stock-nested-verification.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ext.outputs.artifact_tag }}
          target_commitish: ${{ inputs.uki_nested_kvm && github.sha || '' }}
          name: Talos ${{ steps.ext.outputs.artifact_tag }}
          body: |
            Custom Talos image with extensions:
            - Kata: `${{ steps.ext.outputs.ref }}`
            - Core imager: `${{ steps.ext.outputs.imager_ref }}`
            - Native kubelet (empty for stock builds): `${{ steps.ext.outputs.kubelet_ref }}`
            - stargz (empty when disabled): `${{ steps.ext.outputs.stargz_ref }}`

            Build receipt: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

            **Install**: Download `metal-amd64.raw.zst` below
            **Upgrade**: `${{ steps.installer.outputs.ref }}`
          files: |
            /tmp/talos-out/metal-amd64.raw.zst
            ${{ steps.installer.outputs.release_asset }}
            ${{ steps.stock-receipt.outputs.receipt }}
            ${{ steps.stock-receipt.outputs.proof }}
          make_latest: ${{ steps.ext.outputs.make_latest }}
