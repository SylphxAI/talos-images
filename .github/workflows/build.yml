name: Build Talos Image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Talos version (e.g. v1.14.1)"
        default: "v1.14.1"
        required: true
      kata_extension_image:
        description: "Optional explicit Kata extension image (repo:tag@sha256:...). Empty = resolve from the Sidero factory catalog for talos_version."
        default: ""
        required: false
      native_runtime_release:
        description: "Optional native stack manifest: Talos/source identity plus immutable imager, Kata and matching kubelet references. A completed rollout manifest may be reused."
        default: ""
        required: false
      native_host_memory:
        description: "Build the reviewed native host-memory runtime and a separate immutable one-node artifact variant; does not activate it on any node."
        type: boolean
        default: false
        required: false
      stargz:
        description: "Include the release-compatible stargz snapshotter in a separate -stargz artifact variant"
        type: boolean
        default: false
        required: false

env:
  TALOS_VERSION: ${{ inputs.talos_version || 'v1.14.1' }}
  KATA_EXTENSION_IMAGE: ${{ inputs.kata_extension_image || '' }}
  STARGZ_ENABLED: ${{ inputs.stargz && 'true' || 'false' }}
  NATIVE_RUNTIME_RELEASE: ${{ inputs.native_runtime_release || '' }}

jobs:
  build:
    # GitHub's free standard hosted runner (a public repository, owner#750):
    # the imager needs a privileged Docker with loop devices, which our Kata
    # runners do not give (modprobe loop fails, 2026-09-27).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo mv crane /usr/local/bin/

      - name: Build and publish native runtime stack
        if: github.event_name == 'push' || inputs.native_host_memory
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TALOS_VERSION" = v1.14.1 || { echo 'native runtime supports Talos v1.14.1 only' >&2; exit 1; }
          if [ -n "$NATIVE_RUNTIME_RELEASE" ] || [ -n "$KATA_EXTENSION_IMAGE" ]; then
            echo 'local native build cannot be mixed with component overrides' >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y skopeo
          # All OS-stack components share the existing public artifact repository;
          # no new package visibility, credential or repository grant is required.
          kata="ghcr.io/sylphxai/talos-installer:runtime-kata-$SOURCE_SHA"
          imager="ghcr.io/sylphxai/talos-installer:runtime-imager-$SOURCE_SHA"
          kubelet="ghcr.io/sylphxai/talos-installer:v1.36.4-kubelet.$SOURCE_SHA"
          OCI_DIR="$RUNNER_TEMP/native-kata" bash host-memory/build-oci.sh kata
          skopeo copy --authfile "$HOME/.docker/config.json" --all --preserve-digests "oci:$RUNNER_TEMP/native-kata" "docker://$kata"
          OCI_DIR="$RUNNER_TEMP/native-imager" bash host-memory/build-oci.sh imager
          skopeo copy --authfile "$HOME/.docker/config.json" --all --preserve-digests "oci:$RUNNER_TEMP/native-imager" "docker://$imager"
          OCI_DIR="$RUNNER_TEMP/native-kubelet" bash host-memory/build-oci.sh kubelet
          skopeo copy --authfile "$HOME/.docker/config.json" --all --preserve-digests "oci:$RUNNER_TEMP/native-kubelet" "docker://$kubelet"
          kata_digest=$(crane digest "$kata")
          imager_digest=$(crane digest "$imager")
          kubelet_digest=$(crane digest "$kubelet")
          release=$(jq -cn --arg version "$TALOS_VERSION" --arg source "$SOURCE_SHA" --arg imager "${imager%:*}@$imager_digest" --arg kata "${kata%:*}@$kata_digest" --arg kubelet "$kubelet@$kubelet_digest" '{schema_version:1,talos_version:$version,source_revision:$source,imager:$imager,kata_extension:$kata,kubelet:$kubelet,kubelet_version:"v1.36.4"}')
          printf 'NATIVE_RUNTIME_RELEASE=%s\n' "$release" >> "$GITHUB_ENV"
          printf '%s\n' "$release"

      - name: Resolve extensions
        id: ext
        run: bash scripts/resolve-extensions.sh

      # Metal image needs loopback device support — use --privileged
      # and ensure /dev is properly mounted
      - name: Build metal image
        run: |
          sudo modprobe loop
          mkdir -p /tmp/talos-out
          docker run --rm -t \
            -v /tmp/talos-out:/out \
            -v /dev:/dev \
            --privileged \
            ${{ steps.ext.outputs.imager_ref }} metal \
            ${{ steps.ext.outputs.flags }}
          ls -lh /tmp/talos-out/

      - name: Build installer image
        run: |
          mkdir -p /tmp/talos-installer
          docker run --rm -t \
            -v /tmp/talos-installer:/out \
            --privileged \
            ${{ steps.ext.outputs.imager_ref }} installer \
            ${{ steps.ext.outputs.flags }}
          ls -lh /tmp/talos-installer/

      - name: Push installer to GHCR
        id: installer
        env:
          ARTIFACT_TAG: ${{ steps.ext.outputs.artifact_tag }}
        run: |
          set -euo pipefail
          target="ghcr.io/sylphxai/talos-installer:$ARTIFACT_TAG"
          crane push /tmp/talos-installer/installer-amd64.tar "$target"
          digest=$(crane digest "$target")
          printf 'ref=%s@%s\n' "${target%:*}" "$digest" >> "$GITHUB_OUTPUT"
          if [ -n "$NATIVE_RUNTIME_RELEASE" ]; then
            python3 scripts/runtime-release.py --installer "${target%:*}@$digest" > /tmp/talos-out/native-runtime-release.json
            printf 'release_asset=%s\n' /tmp/talos-out/native-runtime-release.json >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ext.outputs.artifact_tag }}
          name: Talos ${{ steps.ext.outputs.artifact_tag }}
          body: |
            Custom Talos image with extensions:
            - Kata: `${{ steps.ext.outputs.ref }}`
            - Core imager: `${{ steps.ext.outputs.imager_ref }}`
            - Native kubelet (empty for stock builds): `${{ steps.ext.outputs.kubelet_ref }}`
            - stargz (empty when disabled): `${{ steps.ext.outputs.stargz_ref }}`

            **Install**: Download `metal-amd64.raw.zst` below
            **Upgrade**: `${{ steps.installer.outputs.ref }}`
          files: |
            /tmp/talos-out/metal-amd64.raw.zst
            ${{ steps.installer.outputs.release_asset }}
          make_latest: ${{ steps.ext.outputs.make_latest }}
