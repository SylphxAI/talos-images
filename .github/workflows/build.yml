name: Build Talos Image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Talos version (e.g. v1.14.1)"
        default: "v1.14.1"
        required: true
      kata_extension_image:
        description: "Optional explicit Kata extension image (repo:tag@sha256:...). Empty = resolve from the Sidero factory catalog for talos_version."
        default: ""
        required: false

env:
  TALOS_VERSION: ${{ inputs.talos_version || 'v1.14.1' }}
  KATA_EXTENSION_IMAGE: ${{ inputs.kata_extension_image || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo mv crane /usr/local/bin/

      - name: Resolve extensions
        id: ext
        run: |
          set -euo pipefail
          FLAGS=""
          if [ -n "${KATA_EXTENSION_IMAGE}" ]; then
            KATA_REF="${KATA_EXTENSION_IMAGE}"
            echo "Using explicit kata_extension_image: ${KATA_REF}"
          else
            CATALOG="https://factory.talos.dev/version/${TALOS_VERSION}/extensions/official"
            KATA_REF=$(curl -fsSL "${CATALOG}" | jq -r '
              .[] | select(.name=="siderolabs/kata-containers")
              | "\(.ref)@\(.digest)"' | head -1)
            if [ -z "${KATA_REF}" ] || [ "${KATA_REF}" = "@" ]; then
              echo "::error::no siderolabs/kata-containers in the factory catalog for ${TALOS_VERSION} (${CATALOG}); pass kata_extension_image explicitly"
              exit 1
            fi
            echo "Resolved kata extension for ${TALOS_VERSION}: ${KATA_REF}"
          fi
          echo "ref=${KATA_REF}" >> "$GITHUB_OUTPUT"
          # Any extra extensions declared in extensions.yaml (may be empty).
          while IFS= read -r ext; do
            [ -z "$ext" ] && continue
            FLAGS="${FLAGS} --system-extension-image ${ext}"
          done < <(sed -n 's/^ *- //p' extensions.yaml)
          FLAGS="${FLAGS} --system-extension-image ${KATA_REF}"
          echo "flags=${FLAGS}" >> "$GITHUB_OUTPUT"
          echo "Extensions:${FLAGS}"

      # Metal image needs loopback device support — use --privileged
      # and ensure /dev is properly mounted
      - name: Build metal image
        run: |
          sudo modprobe loop
          mkdir -p /tmp/talos-out
          docker run --rm -t \
            -v /tmp/talos-out:/out \
            -v /dev:/dev \
            --privileged \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} metal \
            ${{ steps.ext.outputs.flags }}
          ls -lh /tmp/talos-out/

      - name: Build installer image
        run: |
          mkdir -p /tmp/talos-installer
          docker run --rm -t \
            -v /tmp/talos-installer:/out \
            --privileged \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} installer \
            ${{ steps.ext.outputs.flags }}
          ls -lh /tmp/talos-installer/

      - name: Push installer to GHCR
        run: |
          crane push /tmp/talos-installer/installer-amd64.tar \
            ghcr.io/sylphxai/talos-installer:${{ env.TALOS_VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TALOS_VERSION }}
          name: Talos ${{ env.TALOS_VERSION }}
          body: |
            Custom Talos image with extensions:
            - `siderolabs/kata-containers:3.27.0`

            **Install**: Download `metal-amd64.raw.zst` below
            **Upgrade**: `ghcr.io/sylphxai/talos-installer:${{ env.TALOS_VERSION }}`
          files: /tmp/talos-out/metal-amd64.raw.zst
          make_latest: true
