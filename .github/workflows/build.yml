name: Build Talos Image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Talos version (e.g. v1.14.1)"
        default: "v1.14.1"
        required: true
      kata_extension_image:
        description: "Optional explicit Kata extension image (repo:tag@sha256:...). Empty = resolve from the Sidero factory catalog for talos_version."
        default: ""
        required: false
      stargz:
        description: "Include the release-compatible stargz snapshotter in a separate -stargz artifact variant"
        type: boolean
        default: false
        required: false

env:
  TALOS_VERSION: ${{ inputs.talos_version || 'v1.14.1' }}
  KATA_EXTENSION_IMAGE: ${{ inputs.kata_extension_image || '' }}
  STARGZ_ENABLED: ${{ inputs.stargz && 'true' || 'false' }}

jobs:
  build:
    # GitHub's free standard hosted runner (a public repository, owner#750):
    # the imager needs a privileged Docker with loop devices, which our Kata
    # runners do not give (modprobe loop fails, 2026-09-27).
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo mv crane /usr/local/bin/

      - name: Resolve extensions
        id: ext
        run: bash scripts/resolve-extensions.sh

      # Metal image needs loopback device support — use --privileged
      # and ensure /dev is properly mounted
      - name: Build metal image
        run: |
          sudo modprobe loop
          mkdir -p /tmp/talos-out
          docker run --rm -t \
            -v /tmp/talos-out:/out \
            -v /dev:/dev \
            --privileged \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} metal \
            ${{ steps.ext.outputs.flags }}
          ls -lh /tmp/talos-out/

      - name: Build installer image
        run: |
          mkdir -p /tmp/talos-installer
          docker run --rm -t \
            -v /tmp/talos-installer:/out \
            --privileged \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} installer \
            ${{ steps.ext.outputs.flags }}
          ls -lh /tmp/talos-installer/

      - name: Push installer to GHCR
        run: |
          crane push /tmp/talos-installer/installer-amd64.tar \
            ghcr.io/sylphxai/talos-installer:${{ steps.ext.outputs.artifact_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ext.outputs.artifact_tag }}
          name: Talos ${{ steps.ext.outputs.artifact_tag }}
          body: |
            Custom Talos image with extensions:
            - Kata: `${{ steps.ext.outputs.ref }}`
            - stargz (empty when disabled): `${{ steps.ext.outputs.stargz_ref }}`

            **Install**: Download `metal-amd64.raw.zst` below
            **Upgrade**: `ghcr.io/sylphxai/talos-installer:${{ steps.ext.outputs.artifact_tag }}`
          files: /tmp/talos-out/metal-amd64.raw.zst
          make_latest: ${{ steps.ext.outputs.make_latest }}
