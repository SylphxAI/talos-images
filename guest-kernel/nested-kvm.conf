# Nested KVM and virtio-net acceleration inside the x86_64 Kata guest.
#
# When the VMM exposes SVM or VMX to the guest, KVM can provide a guest-owned
# /dev/kvm for nested VMs. This does not pass the host's device into the guest.
# The Kata kernel has CONFIG_MODULES unset, so these drivers must be built in.
#
# VIRTUALIZATION and VHOST_MENU expose the KVM and vhost options under
# allnoconfig. VHOST_NET selects VHOST; x86 KVM derives KVM_X86 when a vendor
# driver is enabled and selects PREEMPT_NOTIFIERS via KVM_COMMON. Kata already
# sets TUN and HIGH_RES_TIMERS in its common fragments.
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
CONFIG_KVM_AMD=y
CONFIG_KVM_INTEL=y
CONFIG_VHOST_MENU=y
CONFIG_VHOST_NET=y
