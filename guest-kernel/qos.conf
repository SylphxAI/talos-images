# Traffic control the cp-etcd-qos baseline needs inside a build lease.
#
# The Kata guest kernel (6.18.35, config version 197) is built with
# CONFIG_MODULES unset, so a qdisc it was not compiled with can never be
# loaded afterwards: `tc qdisc add ... prio|htb|netem` and `tc filter add ...
# flower` fail with "Specified qdisc kind is unknown". The published fragment
# (tools/packaging/kernel/configs/fragments/common/network.conf) enables only
# fq_codel, fq, multiq and fifo, which is why fq_codel works and the others
# do not.
#
# Built in (=y), not as modules, because the kernel has no module support.
# NET_CLS_ACT is what cls_flower links against (tcf_exts_*); NET_ACT_GACT is
# the generic action a classid filter installs. None of the four qdiscs
# selects anything else.
CONFIG_NET_SCH_PRIO=y
CONFIG_NET_SCH_HTB=y
CONFIG_NET_SCH_NETEM=y
CONFIG_NET_CLS_ACT=y
CONFIG_NET_ACT_GACT=y
CONFIG_NET_CLS_FLOWER=y
